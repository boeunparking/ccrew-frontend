server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # ALB 헬스체크. 정적 파일과 무관하게 항상 200을 준다.
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # 런타임 설정은 절대 캐시하지 않는다.
  # 캐시되면 API 주소를 바꿔도 브라우저가 옛날 주소를 계속 쓴다.
  location = /config.js {
    add_header Cache-Control 'no-store, no-cache, must-revalidate';
    expires -1;
  }

  # 해시가 붙은 번들은 영구 캐시해도 안전하다.
  location /assets/ {
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }

  # index.html은 매번 검증한다. 새 배포가 바로 반영되게.
  location = /index.html {
    add_header Cache-Control 'no-cache';
  }

  # SPA 라우팅: /auctions/123 같은 주소로 새로고침해도 index.html을 준다.
  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
